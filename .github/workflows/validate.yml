name: Validate work records

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate work-records contract
        run: python3 scripts/validate_work_records.py

      - name: Run validator tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
